<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Palworld X Dopamintic</title>

    <!-- 노토 산스 kr 폰트 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- 라이브러리들 -->
    <link rel="stylesheet" href="css/normalize.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
      integrity="sha512-1ycn6IcaQQ40/MKBW2W4Rhis/DbILU74C1vSrLJxCq57o941Ym01SwNsOMqvEBFlcgUa6xLiPY/NS5R+E6ztJQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <!-- css -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="main-layout-container">
      <nav class="top-navbar">
        <div class="container">
          <ul class="reset-ul">
            <div class="row">
              <div class="col">
                <li>
                  <a href="/" class="reset-a d-flex">
                    <div class="d-flex align-items-center top-nav-logo-box">
                      <img
                        class="pal-logo"
                        src="img/palworld-logo.jpg"
                        alt=""
                      />
                      <span class="x-logo m-0">X</span>
                      <span class="dopamintic-logo m-0">DOPAMINTIC</span>
                    </div>
                  </a>
                </li>
              </div>

              <div class="col top-nav-menu-container">
                <div
                  class="d-flex justify-content-end align-items-center gap-4 h-100"
                >
                  <li>
                    <a class="reset-a top-nav-btn" href="/rules/">서버 규칙</a>
                  </li>
                  <li>
                    <a class="reset-a red-btn" href="/join-now/"
                      >지금 참여하기</a
                    >
                  </li>
                </div>
              </div>
            </div>
          </ul>
        </div>
      </nav>

      <div class="main-container">
        <div class="hero-container">
          <div class="container">
            <div class="row">
              <div class="col-md-7">
                <div class="hero-title">
                  <h2>개발 공부하다...</h2>
                  <h2>빡쳐서 서버 만듦</h2>
                  <p>
                    봉춘씨의 (아마도) 쓸모 있는
                    <span class="fw-bold">첫 번째</span> 프로젝트
                  </p>
                </div>
              </div>

              <div
                class="hero-img-box col-md-5 d-flex justify-content-lg-end align-items-end"
              >
                <img class="hero-note-img" src="img/note-img.png" alt="" />
              </div>
            </div>
          </div>
        </div>

        <div class="play-now-container">
          <div class="play-now-text-container">
            <div class="play-now-server-logo">
              <img class="pal-logo" src="img/palworld-logo.jpg" />
              <span class="x-logo m-0">X</span>
              <span class="dopamintic-logo m-0">DOPAMINTIC</span>
              <p class="m-0">서버 드디어 오픈!</p>
            </div>
            <p class="play-now-description">
              2026년 09월 04일
              <span>부터!</span>
              매일 저녁 8시
            </p>
            <div class="text-center">
              <a class="reset-a red-btn" href="/join-now/">지금 참여하기</a>
            </div>
          </div>
          <video class="play-now-video" autoplay muted loop>
            <source src="vid/bgvideo.mp4" type="video/mp4" />
          </video>
        </div>

        <div class="about-more-container pb-5">
          <div class="container">
            <h1 class="section-header">더 알아보기</h1>
            <div class="row m-0 gap-2 gap-lg-3">
              <div class="col-md p-0">
                <a class="d-block reset-a" href="/rules/">
                  <div class="about-more-card">
                    <div class="about-more-card-text-container">
                      <h3>서버 규칙</h3>
                      <p>이용하기 전 규칙 확인하기</p>
                    </div>
                    <div class="about-more-img-box">
                      <img
                        class="about-more-card-img"
                        src="img/card 1.png"
                        alt=""
                      />
                    </div>
                  </div>
                </a>
              </div>

              <div class="col-md p-0">
                <a class="d-block reset-a">
                  <div class="about-more-card about-more-card--2">
                    <div class="about-more-card-text-container">
                      <h3>???</h3>
                      <p>추후 공개 예정</p>
                    </div>
                    <div class="about-more-img-box">
                      <img
                        class="about-more-card-img"
                        src="img/who.png"
                        alt=""
                      />
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer>
        <div class="container">
          <div class="footer-logo-container pt-4">
            <p class="dopamintic-slogan m-0">Keep it Active</p>
            <p class="dopamintic-logo m-0">DOPAMINTIC</p>
          </div>

          <div class="d-flex justify-content-center py-3">
            <small>© 2026 Dopamintic</small>
          </div>
        </div>
      </footer>
    </div>

    <!-- 부트스트랩 스크립트 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
